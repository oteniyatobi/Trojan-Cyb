server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-file, non-/v1 path serves index.html so React
    # Router can handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for the API. The browser calls /v1/* on :3000; nginx
    # forwards to the backend container on :8000, injecting the Bearer
    # key so the browser never sees it.
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer changeme";
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Optional: favicon and static assets get long cache headers.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}