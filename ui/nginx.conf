server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-file, non-/v1 path serves index.html so React
    # Router can handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health is public. Small timeout so a dead backend fails fast in the
    # dashboard's health widget.
    location /v1/health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # Ingest is for Wazuh only. Wazuh posts directly to backend:8000
    # from the Docker network; the browser must never reach it. Returning
    # 403 here means a POST to http://localhost:3000/v1/analyze fails at
    # nginx, before it reaches the API.
    location /v1/analyze {
        return 403;
    }

    # Admin settings need their own key. The client sends Authorization,
    # nginx passes it through unchanged. Never inject a key here.
    location /v1/settings/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Everything else under /v1/ (the read endpoints: /v1/alerts,
    # /v1/alerts/<id>). These are open on the internal network; the only
    # path to them is this proxy on :3000, which is not exposed externally
    # in the demo. The `check_api_key` decorator exempts them, so no header
    # is needed.
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # Optional: favicon and static assets get long cache headers.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}