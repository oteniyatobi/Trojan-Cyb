services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"

  dashboard:
    build:
      context: ./ui
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in the root .env}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY in the root .env}
    ports:
      - "3000:80"
