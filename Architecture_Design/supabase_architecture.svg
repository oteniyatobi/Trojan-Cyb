<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title description">
  <title id="title">TROJAN Supabase architecture</title>
  <desc id="description">Local security monitoring sends tenant-scoped application data through the platform backend to Supabase. Staff sign in to the React dashboard with Supabase Auth. Row Level Security isolates organizations, with trusted platform administrators allowed cross-organization access.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .local { fill: #f0fdfa; stroke: #0f766e; }
      .cloud { fill: #eef2ff; stroke: #4f46e5; }
      .text { font: 16px Arial, sans-serif; fill: #334155; }
      .heading { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .boundary { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; rx: 20; }
    </style>
  </defs>
  <rect x="20" y="20" width="1060" height="470" class="boundary"/>
  <text x="50" y="55" class="heading">TROJAN security workspace</text>
  <text x="50" y="80" class="small">On-site monitoring plus Supabase-hosted authentication and tenant data (internet required for dashboard access)</text>

  <rect x="55" y="145" width="250" height="140" class="box local"/>
  <text x="80" y="180" class="heading">Local monitoring</text>
  <text x="80" y="210" class="text">Wazuh agents and manager</text>
  <text x="80" y="237" class="text">Suricata and scan tools</text>
  <text x="80" y="264" class="small">Raw events remain on site</text>

  <rect x="425" y="145" width="250" height="140" class="box"/>
  <text x="450" y="180" class="heading">TROJAN backend</text>
  <text x="450" y="210" class="text">Analysis and service API</text>
  <text x="450" y="237" class="text">Trusted provisioning only</text>
  <text x="450" y="264" class="small">No browser service-role key</text>

  <rect x="795" y="115" width="235" height="200" class="box cloud"/>
  <text x="820" y="150" class="heading">Supabase project</text>
  <text x="820" y="182" class="text">Supabase Auth</text>
  <text x="820" y="210" class="text">Shared managed database</text>
  <text x="820" y="238" class="text">RLS on tenant-owned rows</text>
  <text x="820" y="266" class="text">Realtime (planned)</text>
  <text x="820" y="294" class="small">Members: own orgs only</text>

  <rect x="425" y="365" width="250" height="85" class="box"/>
  <text x="450" y="400" class="heading">React dashboard</text>
  <text x="450" y="428" class="small">Sign-in, organization alerts</text>

  <path d="M305 215 H415" class="arrow"/>
  <text x="332" y="202" class="small">events / findings</text>
  <path d="M675 195 H785" class="arrow"/>
  <text x="700" y="182" class="small">authorized writes</text>
  <path d="M675 400 C760 400 760 310 850 310" class="arrow"/>
  <text x="705" y="380" class="small">Auth + RLS-scoped reads</text>
  <path d="M795 280 C735 330 700 355 675 380" class="arrow"/>

  <text x="55" y="330" class="small">Local monitoring can continue during internet loss; Supabase login and dashboard data require connectivity.</text>
  <text x="55" y="465" class="small">Trusted TROJAN platform administrators are provisioned separately and may access all organizations.</text>
</svg>
