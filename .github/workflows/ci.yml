
name: CI Pipeline

on:
  pull_request:
    branches: [main, tobi]
  push:
    branches: [main, tobi]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Detect backend
        id: detect
        working-directory: .
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/requirements.txt not found, skipping backend linting"
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      - name: Lint with flake8
        if: steps.detect.outputs.exists == 'true'
        run: flake8 . --max-complexity=10 --max-line-length=127 --show-source --statistics

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Detect backend
        id: detect
        working-directory: .
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/requirements.txt not found, skipping backend tests"
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/scanners/requirements.txt

      # wapiti3 is installed so the test of scanners/wapiti_safe.py (the guard
      # that stops Wapiti submitting forms) runs here instead of skipping.
      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r scanners/requirements.txt

      - name: Run tests
        if: steps.detect.outputs.exists == 'true'
        run: |
          python -m unittest discover -v 2>&1 | tee test-output.txt
          if grep -q "wapiti3 is installed only in the scan worker" test-output.txt; then
            echo "::error::The Wapiti form-guard test was skipped"; exit 1
          fi

  backend-image:
    name: Backend Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image copies named files and .dockerignore leaves out scanners/,
      # so an API import of a file that isn't copied only fails here, not in
      # the unit tests (which see the whole folder) or on Vercel.
      - name: Build the image and import the app
        run: |
          docker build -t trojan-backend-ci backend
          docker run --rm trojan-backend-ci python -c "import app; print(len(app.app.url_map._rules), 'routes')"

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: Build check
        run: npm run build

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Run tests
        run: npm test --if-present
